name: A2.1 transaction measurements
on:
  push:
    branches: [recovery/a2-1-transaction-coordination-evidence]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Run the unchanged baseline with the same benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/a21-baseline" 58c17f0b0db023fb1f0ecfa7b51d50cc0c9d14f2
          path=prototypes/integrated-backend/src/transaction-benchmark.mjs
          cp "$path" "$RUNNER_TEMP/a21-baseline/$path"
          cd "$RUNNER_TEMP/a21-baseline"
          node "$path" | tee "$RUNNER_TEMP/baseline.jsonl"
      - name: Run focused transaction assertions
        if: always()
        run: node --test prototypes/integrated-backend/tests/canonical-event-commit.test.mts prototypes/integrated-backend/tests/transaction-coordination.test.mts
      - name: Run candidate with identical fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet 58c17f0b0db023fb1f0ecfa7b51d50cc0c9d14f2 -- prototypes/integrated-backend/src/core.mts; then
            echo 'Core matches baseline; candidate measurement will run after implementation.'
          else
            node prototypes/integrated-backend/src/transaction-benchmark.mjs | tee "$RUNNER_TEMP/candidate.jsonl"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-transaction-measurements
          path: ${{ runner.temp }}/*.jsonl
          retention-days: 30
