name: Agent Evidence Phase D
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Foundation contract and evidence regressions
        run: >-
          node --test
          tests/agent-contracts.test.mjs
          tests/agent/verify.test.mjs
          tests/agent/evidence-policy.test.mjs
          tests/agent/github-ci-evidence.test.mjs
          tests/agent/validate-record.test.mjs
          tests/agent/collector-admission.test.mjs
          tests/agent/collector-reader.test.mjs
          tests/agent/check-publication.test.mjs
          tests/agent/check-readback.test.mjs
          tests/agent/pr-context-reader.test.mjs
          tests/agent/resources.test.mjs
