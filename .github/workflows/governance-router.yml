name: Governance Router

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Aerynth governance
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate governance registry and charter statuses
        run: node scripts/governance-router.mjs --validate
      - name: Test deterministic routing behavior
        run: node --test tests/governance-router.test.mjs tests/governance-context.test.mjs
      - name: Validate cross-document links and normative ownership
        run: node scripts/verify-governance.mjs
      - name: Benchmark section-level governance retrieval and ID coverage
        run: node scripts/benchmark-governance-context.mjs
      - name: Audit engineering-context sufficiency against independent required rules
        run: node scripts/evaluate-governance-engineering.mjs --strict
