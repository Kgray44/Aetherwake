name: CIE evaluation fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/cie-evaluation.yml'
      - 'scripts/benchmarks/cie-quality/**'
      - 'prototypes/vela-core/src/history-retrieval.mts'
      - 'prototypes/integrated-backend/src/execution-profiler.mts'
      - 'prototypes/integrated-backend/src/vela-api-runtime.mts'
      - 'prototypes/integrated-backend/package-lock.json'
      - 'prototypes/integrated-backend/tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/integrated-backend
      - name: Typecheck evaluation tools
        run: node prototypes/integrated-backend/node_modules/typescript/bin/tsc --noEmit -p scripts/benchmarks/cie-quality/tsconfig.json
      - name: Run offline evaluation tests
        run: node --test "scripts/benchmarks/cie-quality/*.test.mts"
