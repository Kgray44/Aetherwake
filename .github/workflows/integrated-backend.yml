name: Integrated Aerynth application
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerynth-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Aerynth Linux integration
    uses: ./.github/workflows/aerynth-integration.yml
    with:
      runner: ubuntu-latest
      timeout: 20
  windows:
    name: Aerynth Windows integration
    uses: ./.github/workflows/aerynth-integration.yml
    with:
      runner: windows-latest
      timeout: 45
  security:
    name: Aerynth security and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Audit all tracked npm lockfiles
        run: node scripts/aerynth-dependency-audit.mjs "$RUNNER_TEMP/aerynth-dependency-audit.json"
      - name: Check workflows and scan introduced commits for secrets
        if: '!cancelled()'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz' | sha256sum --check
          tar -xzf actionlint.tgz actionlint
          curl --fail --silent --show-error --location --retry 2 -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
          # Use the scanner's built-in rules and no repository-owned suppressions.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/aerynth-gitleaks.toml"
          touch "$RUNNER_TEMP/aerynth-gitleaks.ignore"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            scan=(dir .)
          else
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$BASE^{commit}"
            scan=(git "--log-opts=--diff-merges=first-parent $BASE..$GITHUB_SHA" .)
          fi
          "$RUNNER_TEMP/gitleaks" "${scan[@]}" --config "$RUNNER_TEMP/aerynth-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/aerynth-gitleaks.ignore" --ignore-gitleaks-allow --redact=100 --no-banner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: aerynth-dependency-audit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aerynth-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
  required:
    name: Aerynth required checks
    needs: [linux, windows, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record job and step timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" --slurp > "$RUNNER_TEMP/aerynth-jobs.json"
          node scripts/aerynth-ci-timings.mjs "$RUNNER_TEMP/aerynth-jobs.json" "$RUNNER_TEMP/aerynth-timings.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Require all verification jobs to succeed
        env:
          AERYNTH_LINUX: ${{ needs.linux.result }}
          AERYNTH_WINDOWS: ${{ needs.windows.result }}
          AERYNTH_SECURITY: ${{ needs.security.result }}
        run: node scripts/aerynth-ci-gate.mjs "$RUNNER_TEMP/aerynth-gate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: aerynth-gate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aerynth-gate.json
            ${{ runner.temp }}/aerynth-timings.json
          if-no-files-found: error
          retention-days: 14
