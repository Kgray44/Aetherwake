name: Integrated Aerynth application
on:
  pull_request:
    paths:
      - 'Aerynth.cmd'
      - 'prototypes/integrated-backend/**'
      - 'prototypes/openai-provider/**'
      - 'prototypes/application-contract/**'
      - 'prototypes/agent-product/**'
      - 'prototypes/block-library/**'
      - 'prototypes/checklist-product/**'
      - 'prototypes/constellation/**'
      - 'prototypes/conversation-product/**'
      - 'prototypes/personal-context/**'
      - 'prototypes/task-product/**'
      - 'prototypes/timeline-product/**'
      - 'prototypes/timer-product/**'
      - 'prototypes/vela-core/**'
      - 'prototypes/visual-experience/cinematic-v3/**'
      - 'prototypes/workspace-engine/**'
      - 'prototypes/workspace-kernel/**'
      - 'prototypes/connected-conversations/**'
      - 'prototypes/codex-bridge/**'
      - 'scripts/run-aerynth-acceptance.mts'
      - 'scripts/review-*.mjs'
      - 'scripts/verify-living-instruments-native.mjs'
      - 'scripts/living-instruments-*-fixture.mts'
      - '.github/workflows/integrated-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-integration:
    # Windows compiles and exercises the native helpers before the cross-package suite.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            prototypes/integrated-backend/package-lock.json
            prototypes/openai-provider/package-lock.json
            prototypes/block-library/package-lock.json
            prototypes/constellation/package-lock.json
            prototypes/visual-experience/cinematic-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/integrated-backend
      - run: npm ci --ignore-scripts --no-audit --no-fund --cache .runtime/npm-cache
        working-directory: prototypes/openai-provider
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/block-library
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/constellation
      - name: Install desktop test dependencies on Linux
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototypes/visual-experience/cinematic-v3
      - name: Install desktop dependencies for Windows native contract tests
        if: runner.os == 'Windows'
        run: npm ci --no-audit --no-fund
        working-directory: prototypes/visual-experience/cinematic-v3
      - name: Typecheck the backend
        run: npm run typecheck
        working-directory: prototypes/integrated-backend
      - name: Typecheck Vela Core
        run: node prototypes/integrated-backend/node_modules/typescript/bin/tsc --project prototypes/vela-core/tsconfig.json --typeRoots prototypes/integrated-backend/node_modules/@types
      - name: Typecheck the desktop application
        if: runner.os != 'Windows'
        run: npm run typecheck
        working-directory: prototypes/visual-experience/cinematic-v3
      - name: Build the desktop application and Windows native helpers
        if: runner.os == 'Windows'
        run: npm run build
        working-directory: prototypes/visual-experience/cinematic-v3
      - name: Verify the Windows addon boundary before the full suite
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: node --test prototypes/visual-experience/cinematic-v3/tests/windows-system-build.test.mjs
      - name: Verify worker-loss recovery on Windows before the full suite
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: node --test --test-name-pattern "a lost worker never" prototypes/integrated-backend/tests/mission-integration.test.mts
      - name: Test the review build and runtime source contracts
        run: node --test "scripts/review-*.test.mjs"
      - name: Check native journey script syntax
        run: node --check scripts/verify-living-instruments-native.mjs
      - name: Exercise the cross-package acceptance fixtures
        run: node scripts/run-aerynth-acceptance.mts
      - name: Record the native verification boundary
        run: echo "Interactive Windows verification requires a qualified desktop and the host ReserveGuard. This job runs build and synthetic checks."
